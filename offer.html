<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zero Backhand — Exclusive Offer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #141414;
      --surface: #1a1a1a;
      --text: #f5f5f5;
      --text-secondary: #a0a0a0;
      --text-muted: #666;
      --accent: #0ABAB5;
      --accent-dim: rgba(10, 186, 181, 0.08);
      --danger: #ef4444;
      --danger-dim: rgba(239, 68, 68, 0.08);
      --border: rgba(255,255,255,0.06);
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }
    .container { width: 100%; max-width: 480px; }
    .header {
      text-align: center;
      margin-bottom: 28px;
    }
    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .header span { color: var(--accent); }

    .countdown-timer {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 22px;
      margin-bottom: 24px;
      width: 100%;
      justify-content: center;
    }
    .countdown-timer.urgent {
      border-color: rgba(239, 68, 68, 0.3);
      background: var(--danger-dim);
      animation: urgentPulse 2s infinite;
    }
    @keyframes urgentPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
      50% { box-shadow: 0 0 0 8px rgba(239,68,68,0.08); }
    }
    .countdown-timer .label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
    }
    .countdown-timer .digits {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }
    .countdown-timer.urgent .digits { color: var(--danger); }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }
    .product-name {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .product-meta {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .price-block {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }
    .price-block:last-child { border-bottom: none; }
    .price-block .label { font-size: 13px; color: var(--text-secondary); }
    .price-block .value { font-size: 15px; font-weight: 600; }
    .price-block .value.highlight {
      font-size: 22px;
      color: var(--accent);
      font-family: 'Playfair Display', serif;
    }
    .price-block .value.savings { color: var(--danger); }

    .gift-list { list-style: none; }
    .gift-list li {
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .gift-list li:last-child { border-bottom: none; }
    .gift-list li::before {
      content: '+';
      color: var(--accent);
      font-weight: 700;
      width: 16px;
    }

    .note {
      font-style: italic;
      color: var(--text-secondary);
      font-size: 13px;
      padding: 10px 0;
      text-align: center;
    }

    .qr-section {
      text-align: center;
      padding: 20px 0;
    }
    .qr-section .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }
    #qrcode {
      display: inline-block;
      padding: 12px;
      background: #fff;
      border-radius: 12px;
    }
    #qrcode img, #qrcode canvas {
      display: block;
      max-width: 200px;
      max-height: 200px;
    }

    .cta-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 600;
      margin-top: 16px;
      transition: all 0.2s ease;
    }
    .cta-button:hover { background: #089e99; transform: translateY(-1px); }
    .cta-button svg { width: 20px; height: 20px; }

    .footer {
      text-align: center;
      padding: 24px 0;
      font-size: 12px;
      color: var(--text-muted);
    }
    .footer a { color: var(--text-secondary); text-decoration: none; }

    .offer-expired {
      text-align: center;
      padding: 60px 20px;
    }
    .offer-expired h2 {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      margin-bottom: 12px;
      color: var(--danger);
    }
    .offer-expired p { color: var(--text-secondary); margin-bottom: 24px; }
    .offer-expired a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container" id="app">
    <!-- Content injected by offer.js -->
  </div>

  <script src="js/offer.js"></script>
</body>
</html>
